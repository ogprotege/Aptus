[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aptus"
dynamic = ["version"]
description = "Evidence-backed fine-tuning planning, compilation, validation, and local execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "William Sherman" }]
keywords = ["fine-tuning", "llm", "lora", "qlora", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "numpy==2.5.2",
  "pydantic>=2.10,<3",
  "safetensors==0.8.0",
]

[project.urls]
Documentation = "https://github.com/ogprotege/Aptus/tree/main/docs"
Repository = "https://github.com/ogprotege/Aptus"
Issues = "https://github.com/ogprotege/Aptus/issues"
Changelog = "https://github.com/ogprotege/Aptus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
test = ["httpx>=0.28,<1", "ruff==0.16.0"]
desktop-build = ["pyinstaller>=6.16,<7"]

[project.scripts]
aptus = "aptus.cli:main"
aptus-desktop = "aptus.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "aptus.__version__" }

[tool.setuptools.package-data]
aptus = [
  "_bundle_programs/cuda/*.py",
  "_bundle_programs/mlx/*.py",
  "_web/index.html",
  "_web/assets/*",
]

[tool.ruff]
required-version = "==0.16.0"
extend-exclude = ["src/aptus/_bundle_programs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["aptus"]

[tool.coverage.report]
show_missing = true
