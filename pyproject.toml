[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aptus"
version = "0.2.0"
description = "Evidence-backed fine-tuning planning, compilation, validation, and local execution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "William Sherman" }]
keywords = ["fine-tuning", "llm", "lora", "qlora", "machine-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.urls]
Documentation = "https://github.com/ogprotege/Aptus/tree/main/docs"
Repository = "https://github.com/ogprotege/Aptus"
Issues = "https://github.com/ogprotege/Aptus/issues"
Changelog = "https://github.com/ogprotege/Aptus/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
test = ["httpx>=0.28,<1", "ruff>=0.15,<1"]
desktop-build = ["pyinstaller>=6.16,<7"]

[project.scripts]
aptus = "aptus.cli:main"
aptus-desktop = "aptus.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aptus = ["_web/index.html", "_web/assets/*"]

[tool.coverage.run]
source = ["aptus"]

[tool.coverage.report]
show_missing = true
