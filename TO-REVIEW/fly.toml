# fly.toml
app = "finetunex-mcp"
primary_region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "16gb"
  cpu_kind = "shared"
  cpus = 8
  gpu_kind = "a100-40gb"
  gpus = 1
