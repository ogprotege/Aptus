name: Aptus quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Test and build the workbench
        run: |
          npm test
          npm run build
        working-directory: web

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Aptus test environment
        run: python -m pip install -e '.[server,test]'

      - name: Run Python quality gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: "src:."
        run: |
          python -m unittest discover -s tests -t . -v
          python -m compileall -q src tests tools
          ruff check src tests tools
          ruff format --check src/aptus tests/aptus

      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps --wheel-dir /tmp/aptus-wheel

      - name: Smoke installed wheel and packaged workbench
        run: |
          wheel_path="$(find /tmp/aptus-wheel -maxdepth 1 -name 'aptus-*.whl' -print -quit)"
          python -m pip install --force-reinstall --no-deps "$wheel_path"
          cd /tmp
          python -I -c "import re; from pathlib import Path; from fastapi.testclient import TestClient; from aptus.api import create_app; client=TestClient(create_app(state_dir=Path('/tmp/aptus-wheel-state'))); page=client.get('/'); assert page.status_code == 200; asset=re.search(r'/assets/[^\" ]+', page.text).group(0); assert client.get(asset).status_code == 200"

      - name: Check patch whitespace
        run: git diff --check
