name: Aptus

options:
  bundleIdPrefix: com.aptus
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      APTUS_DEVELOPMENT_REPOSITORY_ROOT: "$(SRCROOT)/../.."
    Release:
      APTUS_DEVELOPMENT_REPOSITORY_ROOT: ""
      ENABLE_HARDENED_RUNTIME: YES

targets:
  Aptus:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AptusMark.svg
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aptus.desktop
        PRODUCT_NAME: Aptus
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Aptus.entitlements
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - AptusTests

  AptusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Aptus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aptus.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
